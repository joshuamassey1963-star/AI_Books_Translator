name: ai_book_translator
description: >-
  Cross-platform (Android/iOS) AI book translator. English to Hindi first,
  architecture ready for more languages.
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Session 1 keeps dependencies minimal on purpose. Each new dependency is
# added in the milestone that needs it and recorded in docs/DEPENDENCIES.md.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.3
  # M2 parsers (MIT, see docs/DEPENDENCIES.md)
  archive: ^4.6.0
  xml: ^7.1.0
  crypto: ^3.0.8
  # M2b-1a PDF text engine (MIT; PDFium BSD-3/Apache-2.0, see docs/DEPENDENCIES.md)
  pdfrx: ^2.12.0
  pdfrx_engine: ^0.9.1
  # M2b-1c Unicode NFC (MIT, Unicode 18 data, see docs/DEPENDENCIES.md)
  unorm_dart: ^0.3.3
  # M-DEV-02a scoped system file picker (BSD-3, flutter.dev) and build info (BSD-3)
  file_selector: ^1.1.0
  # M2b-3a PDF export probe, Engine A (Apache-2.0)
  pdf: ^3.13.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
