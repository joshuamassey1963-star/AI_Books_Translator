name: Bootstrap platform folders (one-off)

# Manual helper for milestone M1. The authoring environment cannot run the
# Flutter SDK, so this job runs `flutter create` + `dart format` on a GitHub
# runner and pushes the result to a separate branch for human/agent review.
# It never touches main or develop directly. Safe to delete after M1.

# Triggered by pushing the branch `chore/m1-bootstrap` (Hark's GitHub App
# cannot dispatch workflows), or manually from the Actions tab.
on:
  push:
    branches: ['chore/m1-bootstrap']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.9'
  TARGET_BRANCH: chore/m1-platform-folders

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Generate android/ and ios/
        run: |
          flutter create --platforms=android,ios --org com.aibooktranslator --project-name ai_book_translator .
          rm -f test/widget_test.dart
      - name: Human-readable app name
        run: |
          sed -i 's/android:label="ai_book_translator"/android:label="AI Book Translator"/' android/app/src/main/AndroidManifest.xml
          /usr/bin/python3 - <<'PY'
          import re
          p = 'ios/Runner/Info.plist'
          s = open(p).read()
          s = re.sub(r'(<key>CFBundleDisplayName</key>\s*<string>)[^<]*(</string>)', r'\1AI Book Translator\2', s)
          open(p, 'w').write(s)
          PY
      - run: flutter pub get
      - run: dart format lib test integration_test
      - run: flutter analyze
      - name: Commit to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"
          git add -A
          git status --short
          git commit -m "chore(M1): generate android/ios platform folders and apply dart format (Flutter $FLUTTER_VERSION)"
          git push --force origin "$TARGET_BRANCH"
