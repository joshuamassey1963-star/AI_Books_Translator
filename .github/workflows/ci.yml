name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned Flutter version (see docs/DECISIONS.md D-002). Bump deliberately.
  FLUTTER_VERSION: '3.47.9'

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Format check (report only until first local format pass)
        run: dart format --output=none --set-exit-if-changed lib test integration_test || echo "::warning::dart format would change files"
      - run: flutter analyze
      - run: flutter test --reporter expanded

  build-android-debug:
    name: Android debug build (platform folders generated in CI)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Session 1 could not run `flutter create` locally (SDK download blocked
      # in the authoring sandbox). Until android/ and ios/ are committed,
      # CI generates them without touching lib/. See docs/HANDOVER.md.
      - name: Generate missing platform folders
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android,ios --org com.aibooktranslator --project-name ai_book_translator .
            rm -f test/widget_test.dart
          fi
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
