name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned Flutter version (see docs/DECISIONS.md D-002). Bump deliberately.
  FLUTTER_VERSION: '3.47.9'

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      # `flutter test` does not load pdfium_dart's native asset on the host,
      # so host tests use the same PDFium release (bblanchon/pdfium-binaries,
      # chromium/8125, as pinned by pdfium_dart 0.4.1). See D-021.
      - name: Fetch PDFium for host tests
        run: |
          mkdir -p "$RUNNER_TEMP/pdfium"
          curl -fsSL --retry 3 "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8125/pdfium-linux-x64.tgz" | tar xz -C "$RUNNER_TEMP/pdfium"
          echo "PDFIUM_PATH=$RUNNER_TEMP/pdfium/lib/libpdfium.so" >> "$GITHUB_ENV"
      - run: flutter test --reporter expanded

  build-android-debug:
    name: Android debug build
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Universal debug APK (all ABIs, incl. arm64-v8a). Debug-signed only.
      - run: flutter build apk --debug --dart-define=GIT_SHA=${{ github.sha }}
      - name: Name APK with version and commit
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          SHORT=${GITHUB_SHA::7}
          NAME="ai-book-translator-${VERSION}-debug-${SHORT}.apk"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          ls -l dist
          sha256sum "dist/$NAME"
          {
            echo "### Debug APK"
            echo "- File: \`$NAME\`"
            echo "- Size: $(stat -c %s "dist/$NAME") bytes"
            echo "- SHA-256: \`$(sha256sum "dist/$NAME" | cut -d' ' -f1)\`"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      # Evidence that the APK carries the right version, commit, permissions
      # and which debug certificate signed it (M-DEV-02a).
      - name: Verify APK metadata
        run: |
          APK="dist/$APK_NAME"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:"
          echo "Permissions:"; "$BT/aapt2" dump permissions "$APK"
          if "$BT/aapt2" dump permissions "$APK" | grep -E "EXTERNAL_STORAGE|READ_MEDIA_"; then
            echo "::error::storage permission found"; exit 1
          fi
          if unzip -p "$APK" assets/flutter_assets/kernel_blob.bin | grep -a -q "$GITHUB_SHA"; then
            echo "GIT_SHA $GITHUB_SHA embedded in kernel_blob.bin"
          else
            echo "::error::GIT_SHA not found in APK"; exit 1
          fi
          # Informational: which debug certificate signed this APK.
          "$BT/apksigner" verify --print-certs "$APK" 2>&1 | grep -iE "certificate (DN|SHA-256)" || \
            unzip -p "$APK" 'META-INF/*.RSA' | keytool -printcert | grep -E "Owner|SHA256" || \
            echo "signer certificate could not be printed"
      # Owner APK policy (Session 10): the build above is a compile check.
      # The APK is published only when the commit message contains
      # [publish-apk] (significant user-facing milestones).
      - if: contains(github.event.head_commit.message, '[publish-apk]')
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: dist/${{ env.APK_NAME }}
          retention-days: 14

  pdf-export-probe:
    name: PDF export probe (M2b-3a, evidence only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Tools (poppler, fontTools, Pillow with raqm)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q poppler-utils libraqm0 libfribidi0 libharfbuzz0b
          python3 -m pip install --quiet pillow fonttools
          python3 -c "from PIL import features; print('raqm:', features.check('raqm'))"
          pdftotext -v 2>&1 | head -1
      - name: Fetch OFL Noto fonts (pinned SHA-256, not in git)
        run: tool/pdf_probe/fetch_fonts.sh "$RUNNER_TEMP/probe-fonts"
      - name: Generate probe PDFs (Engine A, Dart pdf package)
        env:
          PDF_PROBE_FONT_DIR: ${{ runner.temp }}/probe-fonts
          PDF_PROBE_OUT_DIR: ${{ github.workspace }}/build/pdf_probe
        run: flutter test test/pdf_probe/ --reporter expanded
      - name: Independent checks (render, extract, fonts)
        run: python3 tool/pdf_probe/verify.py build/pdf_probe "$RUNNER_TEMP/probe-fonts" --print-png-base64
      - name: Summary
        run: cat build/pdf_probe/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: pdf-export-probe-engine-a
          path: build/pdf_probe
          retention-days: 30

  pdf-export-probe-android:
    name: PDF export probe B (Android native, M2b-3b-1, evidence only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tools (poppler, fontTools, Pillow with raqm)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q poppler-utils libraqm0 libfribidi0 libharfbuzz0b
          python3 -m pip install --quiet pillow fonttools
          python3 -c "from PIL import features; print('raqm:', features.check('raqm'))"
      - name: Fetch OFL Noto fonts (pinned SHA-256, used for Hebrew cmap only)
        run: tool/pdf_probe/fetch_fonts.sh "$RUNNER_TEMP/probe-fonts"
      - name: Generate PDFs on the emulator (Engine B)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            mkdir -p build/pdf_probe_b build/android_fonts
            flutter test integration_test/pdf_probe_android_test.dart -d emulator-5554 --reporter expanded > build/pdf_probe_b_test.log 2>&1 || (cat build/pdf_probe_b_test.log; exit 1)
            cat build/pdf_probe_b_test.log | grep -v "PROBE [0-9]"
            adb pull /sdcard/Download/pdf_probe_b/manifest.json build/pdf_probe_b/manifest.json || echo "manifest not on device; using log"
            adb shell ls /system/fonts > build/android_fonts/list.txt
            for f in $(tr -d '\r' < build/android_fonts/list.txt | grep -E 'Devanagari|^Roboto'); do adb pull /system/fonts/$f build/android_fonts/ > /dev/null; done
      - name: Unpack Engine B output
        run: |
          if [ -f build/pdf_probe_b/manifest.json ]; then SRC=build/pdf_probe_b/manifest.json; else SRC=build/pdf_probe_b_test.log; fi
          python3 tool/pdf_probe/unpack_manifest.py build/pdf_probe_b "$SRC"
          python3 tool/pdf_probe/pick_android_fonts.py build/pdf_probe_b build/android_fonts | tee -a "$GITHUB_ENV"
      - name: Independent checks (render, extract, fonts)
        run: python3 tool/pdf_probe/verify.py build/pdf_probe_b "$RUNNER_TEMP/probe-fonts" --print-png-base64
      - name: Summary
        run: cat build/pdf_probe_b/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Collect artifact
        run: |
          rm -f build/pdf_probe_b/manifest.json
          cp build/pdf_probe_b_test.log build/pdf_probe_b/integration_test.log
          cp build/android_fonts/list.txt build/pdf_probe_b/android_system_fonts.txt
      - uses: actions/upload-artifact@v7
        with:
          name: pdf-export-probe-engine-b-android
          path: build/pdf_probe_b
          retention-days: 30

  build-ios-unsigned:
    name: iOS build (no code signing)
    needs: analyze-and-test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Compile check only. Signing/TestFlight needs an Apple Developer
      # account and is out of scope until the V1 release milestone.
      - run: flutter build ios --debug --no-codesign --dart-define=GIT_SHA=${{ github.sha }}
